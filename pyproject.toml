[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rabbitmq-guard"
version = "0.3.0"
description = "Evidence-based, read-only RabbitMQ diagnostics"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
rabbitmq-guard = "rabbitmq_guard.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rabbitmq_guard = ["web/*"]
