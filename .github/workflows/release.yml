name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  github-release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Require a version-matched tag on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          source = pathlib.Path("src/rabbitmq_guard/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__ = "([^"]+)"', source).group(1)
          if os.environ["RELEASE_TAG"] != "v" + version:
              raise SystemExit("tag does not match package version v{}".format(version))
          subprocess.run(
              [
                  "git",
                  "fetch",
                  "origin",
                  "main:refs/remotes/origin/main",
                  "--depth=1",
              ],
              check=True,
          )
          main_sha = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          tag_sha = subprocess.check_output(["git", "rev-list", "-n", "1", os.environ["RELEASE_TAG"]], text=True).strip()
          if tag_sha != main_sha:
              raise SystemExit("release tag must point to the current main commit")
          PY
      - name: Build distributions
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Check distribution contents and metadata
        env:
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: >-
          python scripts/check_distributions.py
          dist/*.whl dist/*.tar.gz
          --expected-version "${EXPECTED_VERSION#v}"
      - name: Test installed distribution
        run: python scripts/installed_package_smoke.py dist/*.whl
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          --verify-tag
          --title "RabbitMQ Guard ${{ github.ref_name }}"
          --generate-notes
